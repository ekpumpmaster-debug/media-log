<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Habit Tracker">
<meta name="theme-color" content="#f7f5f0">
<title>Habit Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#f7f5f0;--surface:#ffffff;--surface2:#f0ede8;--border:#d0c8bc;
  --text:#1a1a1a;--muted:#8a8078;--sub:#a09890;
  --accent:#c0392b;--accent-dim:#fdf0ee;
  --red:#c0392b;--green:#4caf76;
  --font-sans:'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif;
  --font-serif:'Georgia','Times New Roman',serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:15px;overscroll-behavior:none;}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;}
button{font-family:var(--font-sans);cursor:pointer;}

/* ── HEADER ── */
header{padding:20px 20px 0;background:var(--bg);position:sticky;top:0;z-index:10;border-bottom:2px solid var(--text);}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:16px;}
.brand-title{font-size:18px;font-weight:700;letter-spacing:0.06em;font-family:var(--font-serif);}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:0.2em;text-transform:uppercase;}
.date-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.nav-btn{width:32px;height:32px;background:var(--surface);border:1px solid var(--border);border-radius:6px;font-size:18px;color:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.date-block{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.date-main{font-size:13px;font-weight:600;letter-spacing:0.03em;}
.date-sub{font-size:10px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;}
.today-chip{background:var(--accent);color:#fff;border:none;border-radius:4px;font-size:10px;font-weight:700;padding:2px 8px;letter-spacing:0.08em;}
.dow-row{display:flex;margin:0 -4px;}
.dow-btn{flex:1;padding:6px 0;font-size:11px;font-weight:600;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);letter-spacing:0.05em;}
.dow-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.dow-btn.is-today{color:var(--text);}

/* ── PROGRESS ── */
.progress-wrap{padding:14px 20px 0;}
.progress-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .35s ease;}
.progress-label{display:flex;justify-content:space-between;margin-top:6px;}
.progress-count{font-size:11px;color:var(--muted);letter-spacing:0.05em;}
.progress-pct{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:0.05em;}

/* ── TOOLBAR ── */
.toolbar{display:flex;gap:6px;padding:10px 20px 0;align-items:center;}
.filter-group{display:flex;gap:4px;flex:1;}
.filter-btn{font-size:11px;padding:4px 12px;border:1px solid var(--border);border-radius:20px;background:none;color:var(--muted);letter-spacing:0.05em;}
.filter-btn.active{background:var(--text);color:var(--bg);border-color:var(--text);}
.tool-btn{font-size:11px;padding:4px 10px;border:1px solid var(--border);border-radius:20px;background:none;color:var(--muted);letter-spacing:0.05em;display:flex;align-items:center;gap:4px;white-space:nowrap;}
.tool-btn:active{background:var(--surface2);}

/* ── MAIN ── */
main{padding:4px 20px 30px;flex:1;}
.section{margin-top:22px;}
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.section-label{font-size:9px;font-weight:700;letter-spacing:0.25em;color:var(--muted);text-transform:uppercase;white-space:nowrap;}
.section-line{flex:1;height:1px;background:var(--border);}
ul{list-style:none;display:flex;flex-direction:column;gap:2px;}

/* ── HABIT ITEM ── */
li.item{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--border);transition:background .15s;user-select:none;}
li.item.done{background:var(--surface2);border-color:transparent;}
.item-icon{font-size:17px;width:24px;text-align:center;flex-shrink:0;}
.item-body{flex:1;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0;}
.item-name{font-size:14px;font-weight:500;color:var(--text);line-height:1.3;display:flex;align-items:center;gap:6px;}
li.done .item-name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--border);}
.priority-pip{width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0;}
.item-meta{font-size:11px;color:var(--muted);letter-spacing:0.02em;}
.item-memo-preview{font-size:11px;color:var(--sub);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.memo-btn{background:none;border:none;font-size:14px;padding:4px;color:var(--border);flex-shrink:0;line-height:1;}
.memo-btn.has-memo{color:var(--accent);}
.checkbox{width:22px;height:22px;border:1.5px solid var(--border);border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#000;transition:all .15s;cursor:pointer;}
li.done .checkbox{background:var(--accent);border-color:var(--accent);}

/* ── EMPTY ── */
.empty-day{text-align:center;padding:60px 0;display:flex;flex-direction:column;align-items:center;gap:10px;}
.empty-icon{font-size:36px;opacity:.4;}
.empty-text{font-size:12px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;}

/* ── FOOTER ── */
footer{text-align:center;padding:16px 0 env(safe-area-inset-bottom,12px);font-size:9px;color:var(--border);letter-spacing:0.2em;border-top:1px solid var(--border);text-transform:uppercase;}

/* ── MODAL COMMON ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);width:100%;max-width:480px;border-radius:18px 18px 0 0;max-height:90dvh;overflow-y:auto;padding:24px 20px env(safe-area-inset-bottom,20px);}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px;}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;}
.modal-title{font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;font-family:var(--font-serif);}
.modal-subtitle{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:0.03em;}
.modal-close{background:none;border:none;font-size:20px;color:var(--muted);line-height:1;padding:2px;}

/* ── MEMO MODAL ── */
.memo-textarea{width:100%;min-height:130px;border:1px solid var(--border);border-radius:8px;padding:12px;font-size:14px;font-family:var(--font-sans);background:var(--surface2);color:var(--text);resize:none;line-height:1.6;margin-bottom:12px;}
.memo-textarea:focus{outline:none;border-color:var(--accent);}
.memo-actions{display:flex;gap:8px;justify-content:flex-end;}
.btn-primary{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:9px 22px;font-size:13px;font-weight:700;letter-spacing:0.04em;}
.btn-ghost{background:none;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:9px 16px;font-size:13px;}

/* ── SUMMARY MODAL ── */
.summary-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:20px;}
.summary-tab{flex:1;text-align:center;padding:8px 0;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;background:none;border:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;}
.summary-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.sum-month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.sum-month-label{font-size:13px;font-weight:600;letter-spacing:0.05em;}
.sum-nav-btn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;width:30px;height:30px;font-size:16px;color:var(--text);display:flex;align-items:center;justify-content:center;}
.stat-big{text-align:center;margin-bottom:18px;padding:18px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;}
.stat-big-val{font-size:44px;font-weight:800;color:var(--accent);font-family:var(--font-serif);line-height:1;}
.stat-big-lbl{font-size:10px;color:var(--muted);letter-spacing:0.15em;text-transform:uppercase;margin-top:4px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;}
.stat-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;}
.stat-card-val{font-size:22px;font-weight:700;color:var(--text);}
.stat-card-lbl{font-size:9px;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;margin-top:2px;}
.stat-section-lbl{font-size:9px;font-weight:700;letter-spacing:0.2em;color:var(--muted);text-transform:uppercase;margin-bottom:10px;}
.stat-item-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);}
.stat-item-row:last-child{border:none;}
.stat-item-name{flex:1;font-size:12px;color:var(--text);}
.stat-bar-wrap{width:80px;height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.stat-bar{height:100%;background:var(--accent);border-radius:2px;}
.stat-item-pct{font-size:10px;color:var(--muted);width:30px;text-align:right;}

/* ── MEMO LIST ── */
.memo-search-wrap{position:relative;margin-bottom:10px;}
.memo-search{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--border);border-radius:20px;font-size:13px;font-family:var(--font-sans);background:var(--surface2);color:var(--text);}
.memo-search:focus{outline:none;border-color:var(--accent);}
.memo-search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);}
.memo-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
.memo-chip{font-size:10px;padding:3px 10px;border:1px solid var(--border);border-radius:20px;background:none;color:var(--muted);white-space:nowrap;letter-spacing:0.04em;}
.memo-chip.active{background:var(--text);color:var(--bg);border-color:var(--text);}
.memo-entry{padding:13px 0;border-bottom:1px solid var(--border);}
.memo-entry:last-child{border:none;}
.memo-entry-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.memo-entry-media{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:0.05em;}
.memo-entry-date{font-size:10px;color:var(--muted);}
.memo-entry-text{font-size:13px;line-height:1.6;color:var(--sub);}
.memo-entry-text mark{background:#fdf0ee;color:var(--accent);border-radius:2px;padding:0 2px;}
.memo-empty{text-align:center;padding:30px 0;font-size:12px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;}

/* ── EXPORT MODAL ── */
.export-range{display:flex;gap:8px;align-items:center;margin-bottom:16px;}
.export-range label{font-size:11px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;white-space:nowrap;}
.export-range input{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:var(--font-sans);background:var(--surface2);color:var(--text);}
.export-opt{display:flex;align-items:center;gap:14px;padding:15px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;cursor:pointer;margin-bottom:8px;}
.export-opt:active{border-color:var(--accent);}
.export-opt-icon{font-size:26px;}
.export-opt-info{flex:1;}
.export-opt-title{font-size:13px;font-weight:600;margin-bottom:2px;}
.export-opt-desc{font-size:11px;color:var(--muted);}
.export-opt-arrow{color:var(--muted);font-size:16px;}

/* ── HABIT EDITOR MODAL ── */
.habit-list-item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;}
.habit-list-icon{font-size:18px;width:26px;text-align:center;}
.habit-list-body{flex:1;}
.habit-list-name{font-size:13px;font-weight:500;}
.habit-list-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.habit-edit-btn{background:none;border:none;font-size:18px;color:var(--muted);padding:4px;}
.habit-del-btn{background:none;border:none;font-size:16px;color:var(--red);padding:4px;opacity:.7;}
.add-habit-btn{width:100%;padding:12px;border:1px dashed var(--border);border-radius:8px;background:none;color:var(--muted);font-size:13px;letter-spacing:0.08em;margin-top:4px;}
.add-habit-btn:active{background:var(--surface2);}
.form-group{margin-bottom:14px;}
.form-label{font-size:10px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block;}
.form-input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:var(--font-sans);background:var(--surface2);color:var(--text);}
.form-input:focus{outline:none;border-color:var(--accent);}
.form-select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:var(--font-sans);background:var(--surface2);color:var(--text);appearance:none;}
.freq-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.freq-chip{padding:8px 4px;border:1px solid var(--border);border-radius:6px;background:none;color:var(--muted);font-size:12px;text-align:center;font-family:var(--font-sans);}
.freq-chip.sel{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
.dow-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;}
.dow-chip{padding:7px 2px;border:1px solid var(--border);border-radius:6px;background:none;color:var(--muted);font-size:11px;text-align:center;font-family:var(--font-sans);}
.dow-chip.sel{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
.icon-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:4px;}
.icon-chip{padding:8px 4px;border:1px solid var(--border);border-radius:6px;background:none;font-size:18px;text-align:center;cursor:pointer;}
.icon-chip.sel{background:var(--accent-dim);border-color:var(--accent);}
.priority-toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;}
.priority-toggle-label{font-size:13px;color:var(--text);}
.toggle-switch{position:relative;width:40px;height:22px;}
.toggle-switch input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:22px;transition:.2s;}
.toggle-slider:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
.toggle-switch input:checked+.toggle-slider{background:var(--accent);}
.toggle-switch input:checked+.toggle-slider:before{transform:translateX(18px);background:#fff;}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;}
.date-input-row{display:flex;gap:6px;align-items:center;}
.date-input-row input{width:50px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:var(--font-sans);background:var(--surface2);color:var(--text);text-align:center;}
.date-input-row span{font-size:12px;color:var(--muted);}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="brand-title">Habit Tracker</span>
      <span class="brand-sub">Daily · Weekly · Monthly</span>
    </div>
    <div class="date-nav">
      <button class="nav-btn" id="prev-btn">‹</button>
      <div class="date-block">
        <span class="date-main" id="date-main"></span>
        <span class="date-sub" id="date-sub"></span>
        <button class="today-chip" id="today-btn" style="display:none">TODAY</button>
      </div>
      <button class="nav-btn" id="next-btn">›</button>
    </div>
    <div class="dow-row" id="dow-row"></div>
  </header>

  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-label">
      <span class="progress-count" id="progress-count"></span>
      <span class="progress-pct" id="progress-pct"></span>
    </div>
  </div>

  <div class="toolbar">
    <div class="filter-group">
      <button class="filter-btn active" id="filter-priority"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);vertical-align:middle;margin-right:4px;margin-bottom:1px;"></span>Priority</button>
      <button class="filter-btn" id="filter-all">All</button>
    </div>
    <button class="tool-btn" id="summary-btn">📊 Stats</button>
    <button class="tool-btn" id="export-btn">📤</button>
    <button class="tool-btn" id="edit-habits-btn">✏️</button>
  </div>

  <main id="main"></main>
  <footer>Habit Tracker · <span id="year"></span></footer>
</div>

<!-- MEMO MODAL -->
<div class="modal-overlay" id="memo-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div>
        <div class="modal-title" id="memo-modal-title"></div>
        <div class="modal-subtitle" id="memo-modal-date"></div>
      </div>
      <button class="modal-close" id="memo-close">×</button>
    </div>
    <textarea class="memo-textarea" id="memo-textarea" placeholder="Notes, insights, key takeaways…"></textarea>
    <div class="memo-actions">
      <button class="btn-ghost" id="memo-delete-btn">Delete</button>
      <button class="btn-primary" id="memo-save-btn">Save</button>
    </div>
  </div>
</div>

<!-- SUMMARY MODAL -->
<div class="modal-overlay" id="summary-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span class="modal-title">Statistics</span>
      <button class="modal-close" id="summary-close">×</button>
    </div>
    <div class="summary-tabs">
      <button class="summary-tab active" id="tab-stats">📊 Overview</button>
      <button class="summary-tab" id="tab-memos">📝 Notes</button>
    </div>
    <div id="panel-stats">
      <div class="sum-month-nav">
        <button class="sum-nav-btn" id="sum-prev">‹</button>
        <span class="sum-month-label" id="sum-month-label"></span>
        <button class="sum-nav-btn" id="sum-next">›</button>
      </div>
      <div id="summary-content"></div>
    </div>
    <div id="panel-memos" style="display:none">
      <div class="memo-search-wrap">
        <span class="memo-search-icon">🔍</span>
        <input class="memo-search" id="memo-search" type="text" placeholder="Search notes…">
      </div>
      <div class="memo-chips" id="memo-chips"></div>
      <div id="memo-list"></div>
    </div>
  </div>
</div>

<!-- EXPORT MODAL -->
<div class="modal-overlay" id="export-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span class="modal-title">Export Data</span>
      <button class="modal-close" id="export-close">×</button>
    </div>
    <div class="export-range">
      <label>Range</label>
      <input type="month" id="export-from">
      <span style="color:var(--muted);font-size:12px">–</span>
      <input type="month" id="export-to">
    </div>
    <div class="export-opt" id="do-csv">
      <span class="export-opt-icon">📊</span>
      <div class="export-opt-info">
        <div class="export-opt-title">CSV</div>
        <div class="export-opt-desc">Excel · Numbers · Google Sheets</div>
      </div>
      <span class="export-opt-arrow">›</span>
    </div>
    <div class="export-opt" id="do-json">
      <span class="export-opt-icon">🗂️</span>
      <div class="export-opt-info">
        <div class="export-opt-title">JSON Backup</div>
        <div class="export-opt-desc">Full data backup · device migration</div>
      </div>
      <span class="export-opt-arrow">›</span>
    </div>
  </div>
</div>

<!-- HABIT LIST EDITOR MODAL -->
<div class="modal-overlay" id="habits-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span class="modal-title">Manage Habits</span>
      <button class="modal-close" id="habits-close">×</button>
    </div>
    <div id="habits-list"></div>
    <button class="add-habit-btn" id="add-habit-btn">＋ Add New Habit</button>
  </div>
</div>

<!-- HABIT FORM MODAL -->
<div class="modal-overlay" id="habit-form-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span class="modal-title" id="form-title">New Habit</span>
      <button class="modal-close" id="habit-form-close">×</button>

// ═══════════════════════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════════════════════
function ls(key,def=null){try{const v=localStorage.getItem(key);return v!==null?JSON.parse(v):def;}catch{return def;}}
function lsSet(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch{}}

function getHabits(){return ls("ht-habits",DEFAULT_HABITS);}
function setHabits(h){lsSet("ht-habits",h);}
function getChecks(dateStr){return ls("ht-checks-"+dateStr,{});}
function setChecks(dateStr,c){lsSet("ht-checks-"+dateStr,c);}
function getMemo(dateStr,id){return localStorage.getItem("ht-memo-"+dateStr+"-"+id)||"";}
function setMemo(dateStr,id,text){
  if(text.trim()) localStorage.setItem("ht-memo-"+dateStr+"-"+id,text);
  else localStorage.removeItem("ht-memo-"+dateStr+"-"+id);
}

// ═══════════════════════════════════════════════════════════
// FREQUENCY MATCHING
// ═══════════════════════════════════════════════════════════
function getNthWeekday(year,month,weekday,n){
  const first=new Date(year,month-1,1);
  return 1+((weekday-first.getDay()+7)%7)+(n-1)*7;
}
function habitActiveOn(habit,date){
  const f=habit.freq, d=date.getDate(), m=date.getMonth()+1, y=date.getFullYear(), dow=date.getDay();
  if(f.type==="daily") return true;
  if(f.type==="weekly") return f.days.includes(dow);
  if(f.type==="monthly"){
    if(f.subtype==="date") return d===f.day;
    if(f.subtype==="nth") return d===getNthWeekday(y,m,f.dow,f.n);
    if(f.subtype==="odd") return m%2===1&&d===f.day;
    if(f.subtype==="quarter") return (f.months||[]).includes(m)&&d===f.day;
  }
  return false;
}

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
const DOW_EN=["SUN","MON","TUE","WED","THU","FRI","SAT"];
const DOW_JA=["S","M","T","W","T","F","S"];
const FREQ_LABELS={daily:"Daily",weekly:"Weekly",monthly:"Monthly"};
const ICONS=["📰","📖","📚","📺","🎧","🎙️","📱","💻","💡","🌐","📝","✏️","🏃","🧘","💪","🍎","💤","💊","📈","💴","🎯","⭐","🔬","🌍","🎓","🧠","🎵","☕"];

let viewDate=new Date(), showAll=false;
const todayStr=toDS(new Date());
let editingHabitId=null;
let memoFilterId="all", memoSearchQ="";

function toDS(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

// ═══════════════════════════════════════════════════════════
// RENDER MAIN
// ═══════════════════════════════════════════════════════════
function render(){
  const ds=toDS(viewDate), dow=viewDate.getDay(), isToday=ds===todayStr;
  document.getElementById("date-main").textContent=
    viewDate.toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
  document.getElementById("date-sub").textContent=DOW_EN[dow];
  document.getElementById("today-btn").style.display=isToday?"none":"";
  document.getElementById("year").textContent=new Date().getFullYear();

  // dow tabs
  const dowRow=document.getElementById("dow-row");
  dowRow.innerHTML="";
  DOW_JA.forEach((lbl,i)=>{
    const btn=document.createElement("button");
    btn.className="dow-btn"+(i===dow?" active":"")+(i===new Date().getDay()&&!isToday?" is-today":"");
    btn.textContent=lbl;
    btn.onclick=()=>{const t=new Date(viewDate);t.setDate(t.getDate()+(i-dow));viewDate=t;render();};
    dowRow.appendChild(btn);
  });

  const habits=getHabits();
  const checks=getChecks(ds);
  const todayHabits=habits.filter(h=>habitActiveOn(h,viewDate));
  const display=showAll?todayHabits:todayHabits.filter(h=>h.priority);
  const done=display.filter(h=>checks[h.id]).length;
  const total=display.length;
  const pct=total>0?Math.round(done/total*100):0;

  document.getElementById("progress-fill").style.width=pct+"%";
  document.getElementById("progress-count").textContent=`${done} / ${total} completed`;
  document.getElementById("progress-pct").textContent=pct+"%";

  // group by freq
  const daily=todayHabits.filter(h=>h.freq.type==="daily");
  const weekly=todayHabits.filter(h=>h.freq.type==="weekly");
  const monthly=todayHabits.filter(h=>h.freq.type==="monthly");

  const main=document.getElementById("main");
  main.innerHTML="";
  if(daily.length) renderSection(main,"Daily",daily,ds,checks,showAll);
  if(weekly.length) renderSection(main,DOW_EN[dow],weekly,ds,checks,showAll);
  if(monthly.length) renderSection(main,"This Month",monthly,ds,checks,showAll);
  if(!todayHabits.length){
    main.innerHTML='<div class="empty-day"><div class="empty-icon">📅</div><div class="empty-text">No habits scheduled</div></div>';
  }
}

function renderSection(parent,label,habits,ds,checks,all){
  const visible=all?habits:habits.filter(h=>h.priority);
  if(!visible.length) return;
  const sec=document.createElement("div");sec.className="section";
  sec.innerHTML=`<div class="section-header"><span class="section-label">${label}</span><span class="section-line"></span></div>`;
  const ul=document.createElement("ul");
  visible.forEach(h=>{
    const memo=getMemo(ds,h.id), hasMemo=!!memo, done=!!checks[h.id];
    const li=document.createElement("li");
    li.className="item"+(done?" done":"");
    li.innerHTML=`
      <span class="item-icon">${h.icon}</span>
      <div class="item-body">
        <span class="item-name">${h.priority?'<span class="priority-pip"></span>':""}<span>${esc(h.name)}</span></span>
        <span class="item-meta">${esc(h.note||"")}</span>
        ${hasMemo?`<span class="item-memo-preview">📝 ${esc(memo)}</span>`:""}
      </div>
      <button class="memo-btn${hasMemo?" has-memo":""}" title="Note">📝</button>
      <span class="checkbox">${done?"✓":""}</span>
    `;
    li.querySelector(".item-body").onclick=()=>{checks[h.id]=!checks[h.id];setChecks(ds,checks);render();};
    li.querySelector(".checkbox").onclick=()=>{checks[h.id]=!checks[h.id];setChecks(ds,checks);render();};
    li.querySelector(".memo-btn").onclick=e=>{e.stopPropagation();openMemoModal(ds,h);};
    ul.appendChild(li);
  });
  sec.appendChild(ul);parent.appendChild(sec);
}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

// ═══════════════════════════════════════════════════════════
// SUMMARY / STATS
// ═══════════════════════════════════════════════════════════
let sumYear=new Date().getFullYear(),sumMonth=new Date().getMonth()+1;

function getDatesInMonth(y,m){
  const dates=[],d=new Date(y,m-1,1);
  while(d.getMonth()===m-1){dates.push(new Date(d));d.setDate(d.getDate()+1);}
  return dates;
}
function renderStats(){
  document.getElementById("sum-month-label").textContent=
    new Date(sumYear,sumMonth-1,1).toLocaleDateString("en-US",{year:"numeric",month:"long"});
  const dates=getDatesInMonth(sumYear,sumMonth);
  const today=new Date();today.setHours(0,0,0,0);
  const past=dates.filter(d=>{const dd=new Date(d);dd.setHours(0,0,0,0);return dd<=today;});
  const habits=getHabits();
  let totalExp=0,totalDone=0;
  const stats={};
  past.forEach(date=>{
    const ds=toDS(date),ch=getChecks(ds);
    habits.filter(h=>habitActiveOn(h,date)).forEach(h=>{
      if(!stats[h.id])stats[h.id]={label:h.name,exp:0,done:0};
      stats[h.id].exp++;if(ch[h.id])stats[h.id].done++;
      totalExp++;if(ch[h.id])totalDone++;
    });
  });
  const pct=totalExp>0?Math.round(totalDone/totalExp*100):0;
  let cur=0,best=0,tmp=0;
  past.forEach(date=>{
    const ds=toDS(date),ch=getChecks(ds);
    const active=habits.filter(h=>habitActiveOn(h,date));
    const d=active.filter(h=>ch[h.id]).length;
    if(d>0){tmp++;if(tmp>best)best=tmp;}else tmp=0;
  });
  for(let i=past.length-1;i>=0;i--){
    const ds=toDS(past[i]),ch=getChecks(ds);
    const active=habits.filter(h=>habitActiveOn(h,past[i]));
    if(active.filter(h=>ch[h.id]).length>0)cur++;else break;
  }
  document.getElementById("summary-content").innerHTML=`
    <div class="stat-big"><div class="stat-big-val">${pct}%</div><div class="stat-big-lbl">Completion Rate · ${past.length} days</div></div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-card-val">${totalDone}</div><div class="stat-card-lbl">Completed</div></div>
      <div class="stat-card"><div class="stat-card-val">${totalExp-totalDone}</div><div class="stat-card-lbl">Missed</div></div>
      <div class="stat-card"><div class="stat-card-val">${cur}d</div><div class="stat-card-lbl">Current Streak</div></div>
      <div class="stat-card"><div class="stat-card-val">${best}d</div><div class="stat-card-lbl">Best Streak</div></div>
    </div>
    <div class="stat-section-lbl">By Habit</div>
    <div>${Object.values(stats).sort((a,b)=>(b.done/b.exp)-(a.done/a.exp)).map(s=>{
      const p=Math.round(s.done/s.exp*100);
      return`<div class="stat-item-row">
        <span class="stat-item-name">${esc(s.label)}</span>
        <div class="stat-bar-wrap"><div class="stat-bar" style="width:${p}%"></div></div>
        <span class="stat-item-pct">${p}%</span>
      </div>`;
    }).join("")}</div>
  `;
}

function renderMemoList(){
  const all=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k.startsWith("ht-memo-"))continue;
    const val=localStorage.getItem(k);if(!val)continue;
    const rest=k.slice(8);
    const ds=rest.slice(0,10),id=rest.slice(11);
    const habits=getHabits();
    const h=habits.find(x=>x.id===id);
    all.push({ds,id,text:val,name:h?h.name:id});
  }
  all.sort((a,b)=>b.ds.localeCompare(a.ds));
  const ids=[...new Set(all.map(m=>m.id))];
  const habits=getHabits();
  const chips=document.getElementById("memo-chips");
  chips.innerHTML=`<button class="memo-chip${memoFilterId==="all"?" active":""}" data-id="all">All</button>`+
    ids.map(id=>{const h=habits.find(x=>x.id===id);return`<button class="memo-chip${memoFilterId===id?" active":""}" data-id="${id}">${esc(h?h.name:id)}</button>`;}).join("");
  chips.querySelectorAll(".memo-chip").forEach(b=>b.onclick=()=>{memoFilterId=b.dataset.id;renderMemoList();});
  const q=memoSearchQ.trim().toLowerCase();
  let filtered=all;
  if(memoFilterId!=="all")filtered=filtered.filter(m=>m.id===memoFilterId);
  if(q)filtered=filtered.filter(m=>m.text.toLowerCase().includes(q)||m.name.toLowerCase().includes(q));
  const list=document.getElementById("memo-list");
  if(!filtered.length){list.innerHTML='<div class="memo-empty">No notes found</div>';return;}
  list.innerHTML=filtered.map(m=>{
    const d=new Date(m.ds+"T00:00:00");
    const dl=d.toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric",weekday:"short"});
    const hi=q?m.text.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")})`, "gi"),"<mark>$1</mark>"):esc(m.text);
    return`<div class="memo-entry">
      <div class="memo-entry-top"><span class="memo-entry-media">${esc(m.name)}</span><span class="memo-entry-date">${dl}</span></div>
      <div class="memo-entry-text">${hi}</div>
    </div>`;
  }).join("");
}

document.getElementById("memo-search").oninput=e=>{memoSearchQ=e.target.value;renderMemoList();};
document.getElementById("summary-btn").onclick=()=>{

document.getElementById("sum-next").onclick=()=>{sumMonth++;if(sumMonth>12){sumMonth=1;sumYear++;}renderStats();};

function initExport(){
  const now=new Date(),ym=(y,m)=>`${y}-${String(m).padStart(2,"0")}`;
  document.getElementById("export-from").value=ym(now.getFullYear(),now.getMonth()+1);
  document.getElementById("export-to").value=ym(now.getFullYear(),now.getMonth()+1);
}
function download(content,filename,mime){
  const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}
document.getElementById("export-btn").onclick=()=>{initExport();document.getElementById("export-modal").classList.add("open");};
document.getElementById("export-close").onclick=()=>document.getElementById("export-modal").classList.remove("open");
document.getElementById("do-csv").onclick=()=>{
  const from=document.getElementById("export-from").value,to=document.getElementById("export-to").value;
  if(!from||!to)return;
  const [fy,fm]=from.split("-").map(Number),[ty,tm]=to.split("-").map(Number);
  const rows=["\uFEFFDate,Habit,Source,Checked,Note"];
  let y=fy,m=fm;
  while(y<ty||(y===ty&&m<=tm)){
    getDatesInMonth(y,m).forEach(date=>{
      const ds=toDS(date),ch=getChecks(ds),habits=getHabits();
      habits.filter(h=>habitActiveOn(h,date)).forEach(h=>{
        const memo=getMemo(ds,h.id);
        rows.push(`${ds},"${h.name}","${h.note||""}",${ch[h.id]?1:0},"${memo.replace(/"/g,'""')}"`);
      });
    });
    m++;if(m>12){m=1;y++;}
  }
  download(rows.join("\n"),"habit-tracker.csv","text/csv;charset=utf-8");
  document.getElementById("export-modal").classList.remove("open");
};
document.getElementById("do-json").onclick=()=>{
  const data={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k.startsWith("ht-")){try{data[k]=JSON.parse(localStorage.getItem(k));}catch{data[k]=localStorage.getItem(k);}}
  }
  download(JSON.stringify(data,null,2),"habit-tracker-backup.json","application/json");
  document.getElementById("export-modal").classList.remove("open");
};

// ═══════════════════════════════════════════════════════════
// HABIT EDITOR
// ═══════════════════════════════════════════════════════════
function freqLabel(f){
  if(f.type==="daily") return"Daily";
  if(f.type==="weekly") return"Every "+f.days.map(d=>DOW_EN[d]).join(", ");
  if(f.type==="monthly"){
    if(f.subtype==="date") return`Monthly (day ${f.day})`;
    if(f.subtype==="nth") return`Monthly (${["1st","2nd","3rd","4th"][f.n-1]} ${DOW_EN[f.dow]})`;
    if(f.subtype==="odd") return`Odd months (day ${f.day})`;
    if(f.subtype==="quarter") return`Quarterly (day ${f.day})`;
  }
  return"";
}

function renderHabitsList(){
  const habits=getHabits();
  const el=document.getElementById("habits-list");
  if(!habits.length){el.innerHTML='<div class="memo-empty">No habits yet</div>';return;}
  el.innerHTML=habits.map((h,i)=>`
    <div class="habit-list-item">
      <span class="habit-list-icon">${h.icon}</span>
      <div class="habit-list-body">
        <div class="habit-list-name">${esc(h.name)}${h.priority?' <span style="color:var(--accent);font-size:10px">★</span>':""}</div>
        <div class="habit-list-meta">${freqLabel(h.freq)} · ${esc(h.note||"")}</div>
      </div>
      <button class="habit-edit-btn" data-idx="${i}">✏️</button>
      <button class="habit-del-btn" data-idx="${i}">🗑️</button>
    </div>
  `).join("");
  el.querySelectorAll(".habit-edit-btn").forEach(b=>b.onclick=()=>openHabitForm(parseInt(b.dataset.idx)));
  el.querySelectorAll(".habit-del-btn").forEach(b=>b.onclick=()=>{
    if(!confirm("Delete this habit?"))return;
    const h=getHabits();h.splice(parseInt(b.dataset.idx),1);setHabits(h);renderHabitsList();render();
  });
}

document.getElementById("edit-habits-btn").onclick=()=>{
  renderHabitsList();
  document.getElementById("habits-modal").classList.add("open");
};
document.getElementById("habits-close").onclick=()=>document.getElementById("habits-modal").classList.remove("open");
document.getElementById("add-habit-btn").onclick=()=>openHabitForm(null);

// Icon grid
function buildIconGrid(selected){
  const grid=document.getElementById("icon-grid");
  grid.innerHTML=ICONS.map(ic=>`<button class="icon-chip${ic===selected?" sel":""}" data-icon="${ic}">${ic}</button>`).join("");
  grid.querySelectorAll(".icon-chip").forEach(b=>b.onclick=()=>{
    grid.querySelectorAll(".icon-chip").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel");
  });
}
function selectedIcon(){
  const sel=document.querySelector("#icon-grid .icon-chip.sel");
  return sel?sel.dataset.icon:"📖";
}

// Freq UI
let selFreq="daily", selDays=[], selMonthlyType="date";
function setFreq(f){
  selFreq=f;
  document.querySelectorAll(".freq-chip").forEach(b=>{
    b.classList.toggle("sel",b.dataset.freq===f);
  });
  document.getElementById("freq-weekly-opts").style.display=f==="weekly"?"":"none";
  document.getElementById("freq-monthly-opts").style.display=f==="monthly"?"":"none";
}
function buildDowPicker(days){
  selDays=[...days];
  const el=document.getElementById("dow-picker");
  el.innerHTML=DOW_JA.map((d,i)=>`<button class="dow-chip${days.includes(i)?" sel":""}" data-dow="${i}">${d}</button>`).join("");
  el.querySelectorAll(".dow-chip").forEach(b=>b.onclick=()=>{
    const d=parseInt(b.dataset.dow);
    if(selDays.includes(d))selDays=selDays.filter(x=>x!==d);else selDays.push(d);
    b.classList.toggle("sel",selDays.includes(d));
  });
}
function setMonthlyType(t){
  selMonthlyType=t;
  document.getElementById("monthly-date-row").style.display=["date","odd","quarter"].includes(t)?"":"none";
  document.getElementById("monthly-nth-row").style.display=t==="nth"?"":"none";
}
document.getElementById("monthly-type").onchange=e=>setMonthlyType(e.target.value);
document.querySelectorAll(".freq-chip").forEach(b=>b.onclick=()=>setFreq(b.dataset.freq));

function openHabitForm(idx){
  editingHabitId=idx;
  const habits=getHabits();
  const h=idx!==null?habits[idx]:null;
  document.getElementById("form-title").textContent=h?"Edit Habit":"New Habit";
  document.getElementById("f-name").value=h?h.name:"";
  document.getElementById("f-note").value=h?h.note||"":"";
  document.getElementById("f-priority").checked=h?!!h.priority:false;
  buildIconGrid(h?h.icon:"📖");
  const f=h?h.freq:{type:"daily"};
  selFreq=f.type;selDays=f.days||[];selMonthlyType=f.subtype||"date";
  setFreq(f.type);
  buildDowPicker(f.days||[]);
  document.getElementById("monthly-type").value=f.subtype||"date";
  setMonthlyType(f.subtype||"date");
  document.getElementById("monthly-day").value=f.day||1;
  document.getElementById("nth-n").value=f.n||1;
  document.getElementById("nth-dow").value=f.dow||4;
  document.getElementById("habits-modal").classList.remove("open");
  document.getElementById("habit-form-modal").classList.add("open");
}
document.getElementById("habit-form-close").onclick=()=>{
  document.getElementById("habit-form-modal").classList.remove("open");
  document.getElementById("habits-modal").classList.add("open");
};
document.getElementById("habit-form-cancel").onclick=()=>{
  document.getElementById("habit-form-modal").classList.remove("open");
  document.getElementById("habits-modal").classList.add("open");
};
document.getElementById("habit-form-save").onclick=()=>{
  const name=document.getElementById("f-name").value.trim();
  if(!name){alert("Name is required");return;}
  let freq={type:selFreq};
  if(selFreq==="weekly") freq.days=selDays.length?selDays:[new Date().getDay()];
  if(selFreq==="monthly"){
    freq.subtype=selMonthlyType;
    if(["date","odd","quarter"].includes(selMonthlyType)) freq.day=parseInt(document.getElementById("monthly-day").value)||1;
    if(selMonthlyType==="nth"){freq.n=parseInt(document.getElementById("nth-n").value)||1;freq.dow=parseInt(document.getElementById("nth-dow").value)||4;}
    if(selMonthlyType==="quarter"){
      const d=freq.day,months=[];
      for(let m=1;m<=12;m+=3)months.push(m);
      freq.months=months;
    }
  }
  const habit={
    id:editingHabitId!==null?getHabits()[editingHabitId].id:"h-"+Date.now(),
    name,
    note:document.getElementById("f-note").value.trim(),
    icon:selectedIcon(),
    priority:document.getElementById("f-priority").checked,
    freq,
  };
  const habits=getHabits();
  if(editingHabitId!==null) habits[editingHabitId]=habit;
  else habits.push(habit);
  setHabits(habits);
  document.getElementById("habit-form-modal").classList.remove("open");
  renderHabitsList();
  document.getElementById("habits-modal").classList.add("open");
  render();
};

// ═══════════════════════════════════════════════════════════
// NAV
// ═══════════════════════════════════════════════════════════
document.getElementById("prev-btn").onclick=()=>{viewDate.setDate(viewDate.getDate()-1);render();};
document.getElementById("next-btn").onclick=()=>{viewDate.setDate(viewDate.getDate()+1);render();};
document.getElementById("today-btn").onclick=()=>{viewDate=new Date();render();};
document.getElementById("filter-priority").onclick=()=>{
  showAll=false;
  document.getElementById("filter-priority").classList.add("active");
  document.getElementById("filter-all").classList.remove("active");
  render();
};
document.getElementById("filter-all").onclick=()=>{
  showAll=true;
  document.getElementById("filter-all").classList.add("active");
  document.getElementById("filter-priority").classList.remove("active");
  render();
};

// ═══════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════
render();
</script>
